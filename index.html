    document.querySelectorAll('.code.reveal').forEach(function(e){e.classList.add('rr');});
    document.querySelectorAll('.wedge-card.reveal').forEach(function(e){e.classList.add('rs');});
    document.querySelectorAll('.q-list, .why-grid, .trust-grid, .pillars, .stats').forEach(function(grp){
      Array.prototype.slice.call(grp.querySelectorAll('.reveal')).forEach(function(el,i){el.style.transitionDelay=(i*80)+'ms';});
    });
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{threshold:.12,rootMargin:'0px 0px -7% 0px'});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
    // Why Cypher panels: appear one at a time
    var whyPanels=document.querySelectorAll('#why .why-panel');
    whyPanels.forEach(function(el,i){el.style.transitionDelay=(i*140)+'ms';io.observe(el);});
  })();

  // count-up
  (function(){
    function run(el){
      var target=parseFloat(el.getAttribute('data-count')),dur=1100,start=null;
      if(RM){el.textContent=target;return;}
      function step(ts){if(!start)start=ts;var p=Math.min((ts-start)/dur,1);var eased=1-Math.pow(1-p,3);el.textContent=Math.round(eased*target);if(p<1)requestAnimationFrame(step);}
      requestAnimationFrame(step);
    }
    if(!('IntersectionObserver' in window)){document.querySelectorAll('[data-count]').forEach(run);return;}
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){run(en.target);io.unobserve(en.target);}});},{threshold:.6});
    document.querySelectorAll('[data-count]').forEach(function(el){io.observe(el);});
  })();

  // INFRA cards: one header bar fills on scroll; first body open by default, others open as their header fills
  (function(){
    var wrap=document.getElementById('infraCards');
    if(!wrap)return;
    var heads=[].slice.call(wrap.querySelectorAll('.ic-head'));
    var fills=heads.map(function(h){return h.querySelector('.ic-fill');});
    var bodies=[].slice.call(wrap.querySelectorAll('.ic-body'));
    function setCard(i,f){
      fills[i].style.width=(f*100).toFixed(1)+'%';
      heads[i].classList.toggle('lit', f>0.34);
      bodies[i].classList.toggle('open', i===0 || f>0.5);
    }
    var N=heads.length, rest=Math.max(1,N-1);
    setCard(0,1);                                   // first card filled + open by default
    if(RM){for(var k=1;k<N;k++)setCard(k,1);return;}
    var ticking=false;
    function render(){
      ticking=false;
      var r=wrap.getBoundingClientRect(), vh=window.innerHeight;
      // fills while the block sits mid-viewport; short hold so Policy driven reads first
      var p=Math.max(0,Math.min(1,(vh*0.88 - r.top)/(vh*0.5)));
      var lead=0.28;
      var adj=Math.max(0,(p-lead)/(1-lead));
      var seg=1/rest;                               // remaining cards then fill one after another
      for(var i=1;i<N;i++)setCard(i, Math.max(0,Math.min(1,(adj-(i-1)*seg)/seg)));
    }
    function onS(){if(!ticking){ticking=true;requestAnimationFrame(render);}}
    render();
    window.addEventListener('scroll',onS,{passive:true});
    window.addEventListener('resize',onS,{passive:true});
  })();

  // INFRA isometric layers: cursor-tilt, auto explode/reassemble, hover to isolate, click to hold
  (function(){
    var wrap=document.querySelector('#how .iso-wrap');
    var iso=document.querySelector('#how .iso');
    var cap=document.querySelector('#how .layer-caption');
    if(!wrap||!iso||!cap)return;
    var lk=cap.querySelector('.lk'), lt=cap.querySelector('.lt');
    var layers=[].slice.call(document.querySelectorAll('#how .layer'));
    var locked=false, hovering=false, inView=false, autoT=null;

    function show(l){lk.textContent=l.getAttribute('data-num');lt.textContent=l.getAttribute('data-label');cap.classList.add('on');}
    function hide(){if(!locked)cap.classList.remove('on');}
    function explode(on){iso.classList.toggle('exploded',on);
      if(on){lk.textContent='◇';lt.textContent='Three surfaces · one trail';cap.classList.add('on');}else hide();}

    // auto loop: gently fan open, hold, reassemble — only while in view, unlocked, not hovered
    function tick(){
      if(RM){return;}
      if(!inView||locked||hovering){autoT=setTimeout(tick,1400);return;}
      explode(true);
      autoT=setTimeout(function(){
        if(!locked&&!hovering)explode(false);
        autoT=setTimeout(tick,3200);
      },2400);
    }

    // cursor parallax — the stack leans toward the pointer
    if(!RM){
      wrap.addEventListener('pointermove',function(e){
        var r=wrap.getBoundingClientRect();
        var px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
        iso.style.setProperty('--isx',(px*9).toFixed(2)+'deg');
        iso.style.setProperty('--isy',(-py*7).toFixed(2)+'deg');
      });
      wrap.addEventListener('pointerleave',function(){
        iso.style.setProperty('--isx','0deg');iso.style.setProperty('--isy','0deg');
      });
    }

    // hover isolates a single layer (when not exploded)
    layers.forEach(function(l){
      l.addEventListener('mouseenter',function(){if(!iso.classList.contains('exploded'))show(l);});
      l.addEventListener('mouseleave',hide);
      l.addEventListener('focus',function(){show(l);});
      l.addEventListener('blur',hide);
    });
    // hovering the stack fans it open, so individual slabs are cleanly separated to hover
    wrap.addEventListener('pointerenter',function(){hovering=true;if(!locked)explode(true);});
    wrap.addEventListener('pointerleave',function(){hovering=false;if(!locked)explode(false);});

    // click toggles a locked, fully-exploded state
    wrap.addEventListener('click',function(){locked=!locked;explode(locked);});
    wrap.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();locked=!locked;explode(locked);}});

    // drive the auto loop only when the stack is on screen
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){es.forEach(function(en){inView=en.isIntersecting;});},{threshold:.3}).observe(wrap);
    }else{inView=true;}
    if(!RM)autoT=setTimeout(tick,1200);
  })();

  // tab controller (spine + code), spine auto-advances
  function tabs(tablist, opts){
    opts=opts||{};
    var ts=Array.prototype.slice.call(tablist.querySelectorAll('[role=tab]')),timer=null;
    function stopProg(){ts.forEach(function(t){var p=t.querySelector('.spine-prog');if(p)p.classList.remove('run');});}
    function startProg(tab){var p=tab.querySelector('.spine-prog');if(p&&!RM){p.classList.remove('run');void p.offsetWidth;p.classList.add('run');}}
    function select(tab,manual){
      ts.forEach(function(t){var sel=t===tab;t.setAttribute('aria-selected',String(sel));var panel=document.getElementById(t.getAttribute('aria-controls'));if(panel){panel.hidden=!sel;panel.classList.toggle('active',sel);}});
      stopProg(); startProg(tab);
      if(manual&&timer){clearInterval(timer);schedule();}
    }
    function next(){var cur=ts.findIndex(function(t){return t.getAttribute('aria-selected')==='true';});select(ts[(cur+1)%ts.length]);}
    function schedule(){if(opts.auto&&!RM){if(timer)clearInterval(timer);timer=setInterval(next,5200);}}
    ts.forEach(function(t,i){
      t.addEventListener('click',function(){select(t,true);});
      t.addEventListener('keydown',function(e){var idx=ts.indexOf(t);if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();var n=ts[(idx+1)%ts.length];n.focus();select(n,true);}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();var pv=ts[(idx-1+ts.length)%ts.length];pv.focus();select(pv,true);}});
    });
    if(opts.auto){
      startProg(ts[0]); schedule();
      tablist.addEventListener('mouseenter',function(){if(timer){clearInterval(timer);timer=null;stopProg();}});
      tablist.addEventListener('mouseleave',function(){var cur=ts.find(function(t){return t.getAttribute('aria-selected')==='true';});startProg(cur);schedule();});
    }
  }
  document.querySelectorAll('.code-tabs').forEach(function(el){tabs(el,{});});

  // CONTROL PLANE: pinned statement → its two lines unfold into the card outline → scroll steps the states
  (function(){
    var pin=document.getElementById('platform');
    var intro=document.getElementById('cpIntro');
    var stage=document.getElementById('cpStage');
    if(!pin||!stage)return;
    var card=stage.querySelector('.cp2-card');
    var track=stage.querySelector('.cp2-track');
    var rail=stage.querySelector('.cp2-rail');
    var svg=stage.querySelector('.cp2-draw');
    var lineT=pin.querySelector('.cp-line-t'), lineB=pin.querySelector('.cp-line-b');
    var panels=[].slice.call(stage.querySelectorAll('.cp2-panel'));
    var segs=[].slice.call(stage.querySelectorAll('.cp2-seg'));
    var N=panels.length; if(!N)return;

    function fillOf(seg){ return seg.querySelector('.cp2-seg-fill'); }
    // scroll-driven: fills track scroll position exactly, never animate them on a timer
    segs.forEach(function(s){ var f=fillOf(s); if(f) f.style.transition='none'; });

    var lastIdx=-1;
    function markActive(i){
      if(i===lastIdx)return;
      lastIdx=i;
      panels.forEach(function(p,k){ p.classList.toggle('on',k===i); });
      segs.forEach(function(s,k){
        s.classList.toggle('on',k===i);
        s.setAttribute('aria-selected',k===i?'true':'false');
        s.tabIndex = k===i?0:-1;
      });
    }
    markActive(0);

    var desktop=window.matchMedia('(min-width:941px)').matches && !RM;

    if(!desktop){
      // fallback: static statement + card, tabs switch the panels on click
      if(svg)svg.style.display='none';
      if(track)track.style.opacity=1;
      if(rail)rail.style.opacity=1;
      segs.forEach(function(s,idx){
        s.addEventListener('click',function(){ markActive(idx); });
        s.addEventListener('keydown',function(e){
          if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); var n=(idx+1)%N; segs[n].focus(); markActive(n); }
          if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); var pv=(idx-1+N)%N; segs[pv].focus(); markActive(pv); }
        });
      });
      return;
    }

    /* ---------- the two lines unfold into the card's outline ---------- */
    var paths=svg?[].slice.call(svg.querySelectorAll('.dseg')):[];
    var lens=[];
    function buildPaths(){
      if(!svg||!card)return;
      var W=card.clientWidth, H=card.clientHeight, r=8;
      if(!W||!H)return;
      svg.setAttribute('viewBox','0 0 '+W+' '+H);
      // each stroke starts at the top/bottom centre — exactly where a vertical line lands —
      // then wraps a corner and runs to the mid-point of a side.
      var d=[
        'M '+(W/2)+' 0 L '+r+' 0 A '+r+' '+r+' 0 0 0 0 '+r+' L 0 '+(H/2),
        'M '+(W/2)+' 0 L '+(W-r)+' 0 A '+r+' '+r+' 0 0 1 '+W+' '+r+' L '+W+' '+(H/2),
        'M '+(W/2)+' '+H+' L '+r+' '+H+' A '+r+' '+r+' 0 0 1 0 '+(H-r)+' L 0 '+(H/2),
        'M '+(W/2)+' '+H+' L '+(W-r)+' '+H+' A '+r+' '+r+' 0 0 0 '+W+' '+(H-r)+' L '+W+' '+(H/2)
      ];
      lens=[];
      paths.forEach(function(p,i){
        p.setAttribute('d',d[i]);
        var L=p.getTotalLength(); lens.push(L);
        p.style.strokeDasharray=L;
      });
    }
    function drawTo(t){
      paths.forEach(function(p,i){ var L=lens[i]||0; p.style.strokeDashoffset=(L*(1-t)).toFixed(2); });
    }

    // choreography, as a fraction of the pin's scrollable length
    var INTRO_OUT=0.14, STAGE_IN=0.15, DRAW_A=0.17, DRAW_B=0.40,
        CONT_A=0.34, CONT_B=0.45, ST_A=0.46, ST_B=0.94;
    var clamp01=function(v){ return v<0?0:(v>1?1:v); };
    var ticking=false;

    function render(){
      ticking=false;
      var total=pin.offsetHeight-window.innerHeight;
      var sc=Math.min(Math.max(-pin.getBoundingClientRect().top,0),total);
      var p=total>0?sc/total:0;

      // 1. statement fades out
      var iF=clamp01(p/INTRO_OUT);
      if(intro){ intro.style.opacity=(1-iF); intro.style.transform='translateY('+(-iF*26)+'px)'; intro.style.pointerEvents=iF>0.6?'none':''; }

      // 2. the lines retract until their inner ends sit exactly on the card's top/bottom edge
      var gap=Math.max(0,(window.innerHeight-card.clientHeight)/2);
      var startH=Math.min(280,Math.max(120,window.innerHeight*0.27));
      var h=startH+(gap-startH)*iF;
      if(lineT)lineT.style.height=h+'px';
      if(lineB)lineB.style.height=h+'px';

      // 3. stage appears, then the outline draws out of those two points
      stage.style.opacity=clamp01((p-STAGE_IN)/0.06);
      var dP=clamp01((p-DRAW_A)/(DRAW_B-DRAW_A));
      drawTo(dP);
      var lo=1-dP;                       // the lines hand their ink to the outline
      if(lineT)lineT.style.opacity=lo;
      if(lineB)lineB.style.opacity=lo;

      // 4. content + corner ticks fade in
      var cF=clamp01((p-CONT_A)/(CONT_B-CONT_A));
      if(track)track.style.opacity=cF;
      if(rail)rail.style.opacity=cF;
      card.style.setProperty('--tickA',cF);

      // 5. scroll steps through the states; the rail fill IS the scroll position
      var sp=clamp01((p-ST_A)/(ST_B-ST_A));
      var pos=sp*N;                                   // 0 → N across the three states
      markActive(Math.min(N-1,Math.floor(pos)));
      segs.forEach(function(s,k){
        var f=fillOf(s); if(!f)return;
        f.style.height=(clamp01(pos-k)*100).toFixed(2)+'%';
      });
    }

    // clicking a segment scrolls to that state
    function scrollToState(k){
      var total=pin.offsetHeight-window.innerHeight;
      var top=pin.getBoundingClientRect().top+window.pageYOffset;
      var frac=ST_A+((k+0.5)/N)*(ST_B-ST_A);
      window.scrollTo({top:top+total*frac,behavior:'smooth'});
    }
    segs.forEach(function(s,idx){
      s.addEventListener('click',function(){ scrollToState(idx); });
      s.addEventListener('keydown',function(e){
        if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); scrollToState(Math.min(N-1,idx+1)); }
        if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); scrollToState(Math.max(0,idx-1)); }
      });
    });

    function onS(){ if(!ticking){ ticking=true; requestAnimationFrame(render); } }
    buildPaths(); drawTo(0); render();
    window.addEventListener('scroll',onS,{passive:true});
    window.addEventListener('resize',function(){ buildPaths(); onS(); },{passive:true});
  })();

  // WHY CYPHER: pinned giant dial — rises + rotates on scroll, cycles 3 reasons
  (function(){
    var pin=document.getElementById('why');
    if(!pin)return;
    var panels=[].slice.call(pin.querySelectorAll('.why-panel'));
    var dial=pin.querySelector('.why-dial');
    var sheen=pin.querySelector('.dial-sheen');
    var prog=pin.querySelector('.dial-prog');
    var ticksG=pin.querySelector('.dial-ticks');
    var num=pin.querySelector('.dial-num');
    var N=panels.length, ticking=false, lastIdx=-1;
    var desktop=window.matchMedia('(min-width:941px)').matches && !RM;
    if(!desktop || !dial) return; // fallback: CSS stacks all reasons, static
    // arc metrics + build the 3 rim ticks
    var plen=prog.getTotalLength();
    prog.style.strokeDasharray=plen; prog.style.strokeDashoffset=plen;
    var nodes=[], fracs=[];
    for(var k=0;k<N;k++)fracs.push((k+0.5)/N);
    fracs.forEach(function(f){
      var pt=prog.getPointAtLength(plen*f);
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y); c.setAttribute('r',7);
      c.setAttribute('class','dial-tick'); ticksG.appendChild(c); nodes.push(c);
    });
    function render(){
      ticking=false;
      var total=pin.offsetHeight-window.innerHeight;
      var sc=Math.min(Math.max(-pin.getBoundingClientRect().top,0),total);
      var p=total>0?sc/total:0;
      dial.style.transform='translateX(-50%) translateY('+(96-p*104).toFixed(1)+'px)';
      if(sheen)sheen.style.transform='rotate('+(p*150).toFixed(1)+'deg)';
      if(prog)prog.style.strokeDashoffset=(plen*(1-p)).toFixed(1);
      var idx=Math.min(N-1,Math.floor(p*N));
      if(idx!==lastIdx){
        panels.forEach(function(s,i){s.classList.toggle('on',i===idx);});
        nodes.forEach(function(nd,i){nd.classList.toggle('on',i<=idx);});
        if(num)num.textContent='0'+(idx+1);
        lastIdx=idx;
      }
    }
    function onS(){if(!ticking){ticking=true;requestAnimationFrame(render);}}
    render();
    window.addEventListener('scroll',onS,{passive:true});
    window.addEventListener('resize',onS,{passive:true});
  })();

  // GUARD RAILS: per-section — hidden while any [data-no-rails] section owns the viewport
  (function(){
    var rails=document.querySelector('.rails');
    var zones=[].slice.call(document.querySelectorAll('[data-no-rails]'));
    if(!rails||!zones.length)return;
    var ticking=false;
    function upd(){
      ticking=false;
      var mid=window.innerHeight/2, hide=false;
      for(var i=0;i<zones.length;i++){var r=zones[i].getBoundingClientRect();if(r.top<=mid&&r.bottom>=mid){hide=true;break;}}
      rails.classList.toggle('hide',hide);
    }
    function onS(){if(!ticking){ticking=true;requestAnimationFrame(upd);}}
    upd();
    window.addEventListener('scroll',onS,{passive:true});
    window.addEventListener('resize',onS,{passive:true});
  })();

  // HEADLINE: cycle the sensitive-data term, masking each one on the way out
  (function(){
    var rd=document.getElementById('rd'), art=document.getElementById('rdArt');
    if(!rd)return;
    var t=rd.querySelector('.rd-t'), sizer=rd.querySelector('.rd-sizer');
    var TERMS=[['a','BVN'],['an','email address'],['a','NUBAN'],['a','phone number'],
               ['a','NIN'],['an','account number'],['','customer records'],['a','KYC file']];
    // keep the first letter of each word, dot out the rest — mirrors 221•••••89
    function mask(txt){
      return txt.replace(/[^\s]+/g,function(w){
        return w.length<3 ? w.charAt(0)+'•' : w.charAt(0)+Array(w.length).join('•');
      });
    }
    function measure(txt){sizer.textContent=txt;return sizer.offsetWidth;}
    rd.style.width=measure(TERMS[0][1])+'px';
    if(RM)return;                                     // reduced motion: stays on "a BVN"
    var i=0,timer=null,running=false;
    function step(){
      var cur=TERMS[i][1], next=TERMS[(i+1)%TERMS.length][1];
      // 1. mask what's there — chip fills in, characters dot out
      rd.classList.add('masked');
      t.textContent=mask(cur);
      rd.style.width=measure(mask(cur))+'px';
      setTimeout(function(){
        // 2. swap to the next term, still masked
        i=(i+1)%TERMS.length;
        t.textContent=mask(next);
        rd.style.width=measure(mask(next))+'px';
        art.textContent=TERMS[i][0];
        setTimeout(function(){
          // 3. unmask — chip fades out, real characters return
          rd.classList.remove('masked');
          t.textContent=next;
          rd.style.width=measure(next)+'px';
        },520);
      },640);
      timer=setTimeout(step,3400);
    }
    var io=new IntersectionObserver(function(es){es.forEach(function(en){
      if(en.isIntersecting&&!running){running=true;timer=setTimeout(step,1500);}
      else if(!en.isIntersecting&&running){running=false;clearTimeout(timer);}
    });},{threshold:.25});
    io.observe(document.getElementById('ix'));
  })();

  // PROBLEM: scroll-pinned typewriter — questions type in one by one
  (function(){
    var pin=document.getElementById('problem');
    var list=document.getElementById('qList');
    var ans=document.getElementById('qAnswer');
    if(!pin||!list)return;
    // section is no longer pinned: questions are static markup. just reveal the answer.
    [].slice.call(list.querySelectorAll('.q')).forEach(function(el){el.classList.add('typed');});
    if(ans){var io=new IntersectionObserver(function(es){es.forEach(function(en){
      if(en.isIntersecting){ans.classList.add('show');io.disconnect();}});},{threshold:.2});
      io.observe(ans);}
    return;
    var qs=[];
    var N=qs.length;
    var desktop=window.matchMedia('(min-width:941px)').matches && !RM;
    if(!desktop){
      qs.forEach(function(q){q.t.textContent=q.full;q.el.classList.add('typed');});
      if(ans)ans.classList.add('show');
      return;
    }
    var lead=0.05, typeEnd=0.70, typePart=0.78;      // type across [lead,typeEnd]; hold completed panel after
    var span=typeEnd-lead, seg=span/N;
    var lastFinish=lead+(N-1)*seg+seg*typePart;      // when the 5th question finishes typing
    var ticking=false;
    function render(){
      ticking=false;
      var total=pin.offsetHeight-window.innerHeight;
      var sc=Math.min(Math.max(-pin.getBoundingClientRect().top,0),total);
      var p=total>0?sc/total:0;
      var caret=-1;
      for(var i=0;i<N;i++){
        var start=lead+i*seg;
        var lf=Math.max(0,Math.min(1,(p-start)/(seg*typePart)));
        var n=Math.round(lf*qs[i].full.length);
        if(n!==qs[i].n){qs[i].t.textContent=qs[i].full.slice(0,n);qs[i].n=n;}
        qs[i].el.classList.toggle('typed',p>=start);
        if(p>=start && p<start+seg)caret=i;          // caret rides the segment in progress
      }
      for(var k=0;k<N;k++)qs[k].el.classList.toggle('caret',k===caret);
      if(ans)ans.classList.toggle('show',p>=lastFinish+seg*0.12);
    }
    function onS(){if(!ticking){ticking=true;requestAnimationFrame(render);}}
    render();
    window.addEventListener('scroll',onS,{passive:true});
    window.addEventListener('resize',onS,{passive:true});
  })();
<\/script>

<script>
/* interception hero animation */
(function(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const $=id=>document.getElementById(id);
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const cntEl=$('cnt');let count=48213;
  function bump(n){if(!cntEl)return;const t=count+n;const iv=setInterval(()=>{count++;cntEl.textContent=count.toLocaleString();if(count>=t)clearInterval(iv);},110);}
  // shared control plane: each surface reports its evidence into one place
  const cpStrip=$('cpStrip'),cpEviEl=$('cpEvi'),cpSrcEl=$('cpSrc');let cpEvi=128;
  function cpWrite(src,n){
    if(cpSrcEl)cpSrcEl.textContent=src;
    if(cpStrip){cpStrip.classList.remove('write');void cpStrip.offsetWidth;cpStrip.classList.add('write');
      setTimeout(()=>cpStrip.classList.remove('write'),1000);}
    if(cpEviEl&&!reduce){const t=cpEvi+n;const iv=setInterval(()=>{cpEvi++;cpEviEl.textContent=cpEvi;if(cpEvi>=t)clearInterval(iv);},90);}
    else if(cpEviEl){cpEvi+=n;cpEviEl.textContent=cpEvi;}
  }

  const tabs=[...document.querySelectorAll('#ix .ct-tab')];
  const scenes=[$('sc0'),$('sc1'),$('sc2')];
  if(!tabs.length||!scenes[0])return;
  function setScene(i,dur){
    tabs.forEach((t,j)=>{t.classList.toggle('on',j===i);
      const p=t.querySelector('.prog');p.style.transition='none';p.style.width='0%';
      if(j===i&&!reduce){requestAnimationFrame(()=>{p.style.transition='width '+dur+'ms linear';p.style.width='100%';});}
    });
    scenes.forEach((s,j)=>s.classList.toggle('on',j===i));
  }
  function setState(id,s,l){const el=$(id);if(!el)return;el.dataset.s=s;$(id+'-t').textContent=l;}

  const TEXT="Draft a KYC summary for customer BVN 22190210089, contact john.okafor@firstcity.com — flag if the account is overdue.";
  const TOKENS=[["22190210089","221•••••89"],["john.okafor@firstcity.com","j••••@firstcity.com"]];
  function renderTokens(){
    let html=esc(TEXT);
    TOKENS.forEach(t=>{html=html.replace(esc(t[0]),`<span class="tok">${esc(t[0])}<span class="mask">${t[1]}</span></span>`);});
    $('s0-msg').innerHTML=html;
  }
  async function typeOut(){
    const m=$('s0-msg');m.innerHTML='';const caret='<span class="caret"></span>';let shown='';
    for(let i=0;i<TEXT.length;i++){shown+=TEXT[i];m.innerHTML=esc(shown)+caret;await wait(TEXT[i]===' '?20:(Math.random()*22+14));}
    renderTokens();m.insertAdjacentHTML('beforeend',caret);
  }
  async function sceneBrowser(){
    $('s0-verdict').classList.remove('show');
    $('s0-composer').classList.remove('inspecting','blocked');
    $('s0-ext').classList.remove('live');
    $('s0-mon').style.opacity='1';$('s0-now').textContent='inspecting…';
    setState('s0-state','monitor','Monitoring');
    $('s0-msg').innerHTML='<span class="caret"></span>';
    await wait(600);
    $('s0-ext').classList.add('live');           // extension is watching the page
    if(reduce){renderTokens();}else{await typeOut();}
    await wait(420);
    $('s0-send').classList.add('fire');await wait(150);
    setState('s0-state','inspect','Inspecting');
    $('s0-composer').classList.add('inspecting');$('s0-pane').classList.add('scanning');
    document.querySelectorAll('#sc0 .tok').forEach(el=>el.classList.add('hot'));
    await wait(reduce?200:1100);
    $('s0-pane').classList.remove('scanning');
    document.querySelectorAll('#sc0 .tok').forEach(el=>{el.classList.remove('hot');el.classList.add('caught');});
    $('s0-composer').classList.remove('inspecting');$('s0-composer').classList.add('blocked');
    setState('s0-state','block','Blocked');$('s0-send').classList.remove('fire');
    $('s0-now').textContent='blocked';
    await wait(reduce?200:800);
    $('s0-mon').style.opacity='.3';$('s0-verdict').classList.add('show');bump(4);cpWrite('browser',4);
    await wait(reduce?3200:3400);
  }
  async function sceneEndpoint(){
    const disc=[...document.querySelectorAll('#s1-disc .disc-item')];
    const kyc=$('s1-kyc'),pop=$('s1-pop'),cap=$('s1-disccap'),tag=$('s1-kyctag');
    // reset
    $('s1-verdict').classList.remove('show');pop.classList.remove('show');
    disc.forEach(d=>d.classList.remove('in','flag'));
    tag.textContent='scanning…';tag.className='di-tag';
    $('s1-kycm').textContent='unmanaged script · → api.openai.com';
    cap.classList.remove('done');cap.textContent='Discovering AI apps on this device…';
    $('s1-mon').style.opacity='1';$('s1-now').textContent='discovering…';
    setState('s1-state','monitor','Discovering');
    await wait(500);
    // 1. discover each AI app on the device
    for(let i=0;i<disc.length;i++){disc[i].classList.add('in');await wait(reduce?110:560);}
    cap.classList.add('done');cap.textContent='3 AI apps found · 2 governed, 1 unmanaged';
    await wait(reduce?200:750);
    // 2. the unmanaged one tries to send customer data out
    setState('s1-state','inspect','Scanning request');
    tag.textContent='sending 1,204 records…';
    await wait(reduce?300:1250);
    // 3. blocked before it leaves the device
    kyc.classList.add('flag');tag.textContent='blocked';tag.className='di-tag';
    $('s1-kycm').textContent='held before it left the machine';
    setState('s1-state','block','Blocked');$('s1-now').textContent='blocked';
    pop.classList.add('show');
    await wait(reduce?400:1400);
    $('s1-mon').style.opacity='.3';$('s1-verdict').classList.add('show');bump(3);cpWrite('endpoint',3);
    await wait(reduce?3000:3300);
    pop.classList.remove('show');
  }
  async function sceneGateway(){
    const rows=[...document.querySelectorAll('#s2-rows .gw-row')];
    rows.forEach(r=>r.classList.remove('in'));
    $('s2-pipe').style.opacity='0';$('s2-verdict').classList.remove('show');
    $('s2-mon').style.opacity='1';$('s2-now').textContent='evaluating…';
    setState('s2-state','monitor','Routing');
    await wait(500);
    for(let i=0;i<rows.length;i++){rows[i].classList.add('in');await wait(reduce?80:420);}
    setState('s2-state','inspect','Inspecting');
    await wait(reduce?200:700);
    $('s2-pipe').style.opacity='1';
    setState('s2-state','block','Blocked');$('s2-now').textContent='blocked';
    await wait(reduce?300:1100);
    $('s2-mon').style.opacity='.3';$('s2-verdict').classList.add('show');bump(5);cpWrite('gateway',5);
    await wait(reduce?3000:3200);
  }
  const runners=[sceneBrowser,sceneEndpoint,sceneGateway];
  const durations=[10200,10400,8400];
  async function loop(){let i=0;while(true){setScene(i,durations[i]);await runners[i]();await wait(400);i=(i+1)%3;}}
  // allow manual tab selection to jump scenes
  tabs.forEach((t,i)=>t.addEventListener('click',()=>{scenes.forEach((s,j)=>s.classList.toggle('on',j===i));tabs.forEach((x,j)=>x.classList.toggle('on',j===i));}));
  window.addEventListener('load',()=>setTimeout(loop,800));
})();
<\/script>

<script>
/* bundle shim: this page runs inside a single-file shell, so links to the other
   pages are handed to the shell instead of navigating a file that isn't there. */
(function(){
  document.addEventListener('click',function(e){
    if(e.defaultPrevented)return;                    // page already handled it (shutter)
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
    if(!a)return;
    var h=a.getAttribute('href')||'';
    if(/^[a-z0-9-]+\.html([?#][^"]*)?$/i.test(h)){ e.preventDefault(); parent.postMessage({__nav:h},'*'); }
  });
})();

  /* layout */

  .toc{position:sticky;top:104px;align-self:start}
  @media (max-width:860px){.toc{position:static;border-bottom:1px solid var(--line);padding-bottom:20px}}
  .toc h6{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tx-mute);font-weight:500;margin-bottom:12px}
  .toc a{display:block;padding:7px 0;font-size:14.5px;color:var(--tx-soft);text-decoration:none;
    border-left:2px solid var(--line);padding-left:14px;transition:color .2s,border-color .2s}
  .toc a:hover{color:var(--tx);border-left-color:var(--acc)}

  section.doc{scroll-margin-top:96px}
  section.doc + section.doc{margin-top:clamp(48px,6vw,76px);padding-top:clamp(40px,5vw,60px);border-top:1px solid var(--line)}
  h2{font-family:var(--head);font-weight:var(--w-med);font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.1}
  h3{font-family:var(--head);font-weight:var(--w-semi);font-size:17.5px;letter-spacing:-.015em;margin:30px 0 8px}
  p{color:var(--tx-soft);margin-top:12px;max-width:68ch}
  ul{margin:12px 0 0 20px;color:var(--tx-soft);max-width:68ch}
  li{margin:6px 0}
  a.link{color:var(--acc-ink);font-weight:var(--w-med)}
  .callout{margin-top:22px;border:1px solid var(--line);border-left:2px solid var(--acc);
    background:var(--paper-2);border-radius:var(--radius);padding:16px 18px}
  .callout p{margin-top:0;color:var(--tx-soft);font-size:14.5px}

  /* footer */
  footer{background:var(--ink);color:var(--hi);padding:44px 0}
  .ft-in{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;

  .ft-in a{color:rgba(255,255,255,.75);text-decoration:none}
  .ft-in a:hover{color:#fff}
  @media (max-width:820px){.ft-in a,a.link{display:inline-block;padding:6px 0}}

    <!-- ─────────── PRIVACY ─────────── -->
    <section class="doc" id="privacy">
      <h2>Privacy policy</h2>
      <p>This policy explains what PlatformOne collects when you use our website and products, why we collect it, and the choices you have. It applies to PlatformOne and to the products we operate, including Cypher.</p>

      <h3>What we collect</h3>
      <ul>
        <li><b>Information you give us.</b> Your name, work email, company, and anything you write when you request a demo or contact us.</li>
        <li><b>Product data.</b> When your organisation uses our products, we process the configuration, policy, and activity records needed to provide the service.</li>
        <li><b>Technical data.</b> Basic information your browser sends, such as device type and pages viewed, used to keep the site working and secure.</li>
      </ul>

      <h3>How we use it</h3>
      <ul>
        <li>To respond to your enquiry and provide the service you asked for.</li>
        <li>To operate, secure, support, and improve our products.</li>
        <li>To meet legal, regulatory, and contractual obligations.</li>
      </ul>

      <h3>What we do not do</h3>
      <p>We do not sell your personal information. We do not use customer content to train third-party models. Access to customer data is limited to the people who need it to run and support the service.</p>

      <h3>Sharing</h3>
      <p>We share information with service providers who help us operate the business, and only to the extent they need it to perform that work. We may disclose information where the law requires it. Where a provider processes personal data on our behalf, they are bound by written terms.</p>

      <h3>Retention</h3>
      <p>We keep information for as long as needed to provide the service and meet our legal obligations, then delete or anonymise it. Where your organisation controls a retention period under its agreement with us, that period governs.</p>

      <h3>Your rights</h3>
      <p>Depending on where you are, you may have the right to access, correct, export, or delete your personal information, and to object to or restrict certain processing. If our product processes data on your employer's behalf, please contact them first; we will support them in responding.</p>
      <div class="callout">
        <p>To exercise any of these rights, email <a class="link" href="mailto:hello@getplatformone.com">hello@getplatformone.com</a> and tell us what you need.</p>
      </div>
    </section>

    <!-- ─────────── TERMS ─────────── -->
    <section class="doc" id="terms">
      <h2>Terms of service</h2>
      <p>These terms govern your use of the PlatformOne website and any product made available through it, unless a signed agreement between us says otherwise. Where a signed agreement exists, that agreement controls.</p>

      <h3>Using the service</h3>
      <p>You may use the service only in line with these terms and applicable law. You are responsible for the accounts and credentials issued to your organisation, for activity carried out under them, and for the content your organisation submits.</p>

      <h3>Acceptable use</h3>
      <ul>
        <li>Do not attempt to breach, probe, or disrupt the service or its safeguards.</li>
        <li>Do not use the service to break the law or to infringe anyone's rights.</li>
        <li>Do not resell or provide access to the service to third parties without our written agreement.</li>
      </ul>

      <h3>Your data and ours</h3>
      <p>Your organisation keeps ownership of the content it submits. You grant us the limited rights needed to operate and support the service. We keep ownership of the software, interfaces, and documentation we provide, and of anything we develop independently.</p>

      <h3>Availability and change</h3>
      <p>We work to keep the service available and secure, but we do not guarantee uninterrupted operation. We may change or discontinue features; where a change materially reduces a paid feature, we will give reasonable notice to the customer.</p>

      <h3>Liability</h3>
      <p>To the extent the law allows, neither party is liable for indirect or consequential loss. Nothing in these terms limits liability that cannot lawfully be limited. Any specific caps or warranties are set out in the signed agreement between us.</p>

      <h3>Changes to these terms</h3>
      <p>We may update these terms. Where a change is material, we will update the date at the top of this page and, for customers, give notice through the account or by email.</p>
      <div class="callout">
        <p>Questions about these terms? Email <a class="link" href="mailto:hello@getplatformone.com">hello@getplatformone.com</a>.</p>
      </div>
    </section>

    <!-- ─────────── DATA PROTECTION ─────────── -->
    <section class="doc" id="data-protection">
      <h2>Data protection</h2>
      <p>Our products sit in the path of sensitive information, so how we handle that information is part of the product rather than an afterthought.</p>

      <h3>How data is protected</h3>
      <ul>
        <li>Data is encrypted in transit and at rest.</li>
        <li>Access is role-based, granted on a need-to-know basis, and logged.</li>
        <li>Administrative and configuration changes are written to an append-only audit record.</li>
        <li>Environments are separated so that one customer's data is not reachable from another's.</li>
      </ul>

      <h3>Where data is processed</h3>
      <p>We aim to process and store customer data in the region a customer requires, and to make the location explicit in the agreement rather than leaving it to be discovered. Where a transfer across borders is necessary, we put an appropriate safeguard in place first.</p>

      <h3>Processors</h3>
      <p>We use a small set of infrastructure and support providers. Each is bound by written data processing terms, and we review the list as it changes. Customers can request the current list.</p>

      <h3>Incidents</h3>
      <p>If we become aware of a breach affecting customer personal data, we will investigate, contain it, and notify affected customers without undue delay, along with what we know and what we are doing about it.</p>

      <h3>Data processing agreements</h3>
      <p>We can enter into a data processing agreement with customers who need one, and support security reviews and questionnaires as part of procurement.</p>
      <div class="callout">
        <p>For a DPA, the processor list, or a security review, email <a class="link" href="mailto:hello@getplatformone.com">hello@getplatformone.com</a>.</p>
      </div>
    </section>

  var TITLES = {
    platformone:'PlatformOne · The building blocks AI runs on',
    cypher:'Cypher — The control plane for enterprise AI',
    legal:'Legal · PlatformOne'
  };
  var ROUTES = {
    'platformone.html':'platformone',
    'cypher-website.html':'cypher',
    'legal.html':'legal'
  };
  var frame = document.getElementById('frame');
  var boot  = document.getElementById('boot');
  var pending = null, current = null;

  function source(key){
    var el = document.getElementById('pg-' + key);
    if(!el) return null;
    var html = el.textContent.split('<\\/script').join('</script').split('<\\/body').join('</body');
    for(var k in ASSETS) html = html.split(k).join(ASSETS[k]);
    return html;
  }

  function render(key, opts){
    opts = opts || {};
    var html = source(key);
    if(!html) return;
    if(opts.shutter){
      html = html.replace('<head>', '<head><script>window.__ENTER="shutter";<\/script>');
    }
    current = key;
    // the tab icon follows the brand you're looking at
    var brand = (key === 'cypher') ? 'cy' : 'p1';
    var fav = document.getElementById('fav'), tc = document.getElementById('tcolor');
    if(fav) fav.href = ICONS[brand];
    if(tc)  tc.setAttribute('content', brand === 'cy' ? '#0B1418' : '#090C1A');
    document.title = TITLES[key] || 'PlatformOne & Cypher';
    frame.onload = function(){
      boot.classList.add('gone');
      if(opts.hash){
        try{
          var d = frame.contentDocument, el = d.getElementById(opts.hash);
          if(el) el.scrollIntoView();
        }catch(e){}
      }
    };
    frame.srcdoc = html;
  }

  // a page asked to go somewhere
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || !d.__nav) return;
    var m = String(d.__nav).match(/^([a-z0-9-]+\.html)(?:\?([^#]*))?(?:#(.*))?$/i);
    if(!m) return;
    var key = ROUTES[m[1].toLowerCase()];
    if(!key) return;
    pending = { shutter: (m[2]||'').indexOf('enter=shutter') > -1, hash: m[3] || '' };
    var want = '#' + key + (m[3] ? '/' + m[3] : '');
    if(location.hash === want) route(); else location.hash = want;
  });

  function route(){
    var raw = (location.hash || '').replace(/^#/, '') || 'platformone';
    var bits = raw.split('/');
    var key = bits[0];
    if(!document.getElementById('pg-' + key)) key = 'platformone';
    var opts = pending || { hash: bits[1] || '' };
    pending = null;
    if(key === current && !opts.shutter && !opts.hash) return;
    render(key, opts);
  }

  window.addEventListener('hashchange', route);
  route();
})();
