<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — PlatformOne</title>
<meta name="description" content="That page doesn't exist. Head back to PlatformOne or Cypher." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/assets/icon-platformone.svg">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0B1418;--acid:#C9F73D;--hi:#F2F5F4;--hi-2:#A6B4B8;--hi-3:#6B7A7E;
    --line:rgba(255,255,255,.14);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  body{min-height:100svh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:0;padding:40px 24px;text-align:center;
    background:var(--ink);color:var(--hi);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased}
  .code{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--hi-3);display:inline-flex;align-items:center;gap:10px}
  .code::before{content:"//";color:var(--acid);letter-spacing:0}
  h1{margin:20px 0 0;font-size:clamp(30px,5vw,48px);line-height:1.06;letter-spacing:-.035em;
    font-weight:500;text-wrap:balance}
  p{margin:16px 0 0;color:var(--hi-2);font-size:17px;max-width:44ch}
  .actions{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  a.btn{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:500;
    padding:13px 24px;border-radius:999px;border:1px solid transparent;text-decoration:none;
    transition:transform .16s cubic-bezier(.22,.61,.36,1),background .2s,border-color .2s}
  a.primary{background:var(--acid);color:var(--ink)}
  a.primary:hover{background:#A8D420;transform:translateY(-2px)}
  a.ghost{background:rgba(255,255,255,.05);color:var(--hi);border-color:var(--line)}
  a.ghost:hover{border-color:rgba(255,255,255,.34);transform:translateY(-2px)}
  .sig{margin-top:44px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(255,255,255,.28)}
  @media (prefers-reduced-motion:reduce){a.btn:hover{transform:none}}
</style>
</head>
<body>
  <span class="code">Error 404</span>
  <h1>That page doesn't exist.</h1>
  <p>The link may be out of date, or the address mistyped. Everything else is still where you left it.</p>
  <div class="actions">
    <a class="btn primary" href="/cypher/">Go to Cypher</a>
    <a class="btn ghost" href="/">PlatformOne home</a>
  </div>
  <div class="sig">A PlatformOne company</div>
</body>
</html>
